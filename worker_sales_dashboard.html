<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.5}
.header{background:linear-gradient(135deg,#1e293b,#334155);padding:28px 40px;border-bottom:1px solid #334155}
.header h1{font-size:22px;font-weight:700;color:#f8fafc}
.header p{color:#94a3b8;margin-top:4px;font-size:13px}
.container{max-width:1440px;margin:0 auto;padding:20px}

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.sc{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155}
.sc .lb{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
.sc .vl{font-size:24px;font-weight:700;color:#f8fafc;margin-top:2px}
.sc .sb{font-size:12px;color:#64748b;margin-top:2px}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:12px;transition:all .15s}
.tab:hover{border-color:#475569;color:#e2e8f0}
.tab.active{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}

.section{background:#1e293b;border-radius:10px;padding:20px;margin-bottom:16px;border:1px solid #334155}
.section h2{font-size:16px;font-weight:600;color:#f8fafc;margin-bottom:12px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#0f172a;padding:8px 10px;text-align:left;font-weight:600;color:#94a3b8;border-bottom:2px solid #334155;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid rgba(51,65,85,.5)}
tr:hover td{background:rgba(51,65,85,.4)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:#4ade80;font-weight:600}
.neg{color:#f87171;font-weight:600}
.muted{color:#64748b}

.bar-c{display:flex;align-items:center;gap:6px}
.bar{height:18px;border-radius:3px;min-width:2px;transition:width .3s}

.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.chart-row{grid-template-columns:1fr}}
.mc{background:#1e293b;border-radius:10px;padding:16px;border:1px solid #334155}
.mc h3{font-size:13px;color:#94a3b8;margin-bottom:10px;font-weight:600}

.dow-bar{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.dow-lb{width:28px;font-size:11px;color:#94a3b8;text-align:center}
.dow-fl{height:20px;border-radius:3px;display:flex;align-items:center;padding-left:6px;font-size:10px;color:#fff;font-weight:500;min-width:2px}

.combo-card{background:#0f172a;border-radius:6px;padding:10px 14px;margin-bottom:6px;border-left:3px solid #3b82f6}
.combo-w{font-size:12px;font-weight:600;color:#e2e8f0}
.combo-s{font-size:11px;color:#94a3b8;margin-top:2px}

.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700}
.rank-1{background:#fbbf24;color:#1e293b}.rank-2{background:#94a3b8;color:#1e293b}.rank-3{background:#cd7f32;color:#1e293b}.rank-n{background:#334155;color:#94a3b8}

.role-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.3px}
.role-mgr{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.role-arb{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
.role-etc{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.25)}

.comp-bar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:4px 0}
.comp-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}

.store-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:6px}
.store-hd .sn{font-size:18px;font-weight:700;color:#f8fafc}
.store-hd .sm{font-size:12px;color:#64748b}
.sm span{margin-left:12px}

.insight-card{background:#0f172a;border-radius:8px;padding:14px 18px;margin-bottom:8px;border:1px solid #334155}
.insight-card .title{font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:4px}
.insight-card .body{font-size:12px;color:#94a3b8;line-height:1.6}

.dep-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(51,65,85,.4)}
.dep-store{width:100px;font-weight:600;font-size:12px;color:#e2e8f0;flex-shrink:0}
.dep-bar-wrap{flex:1;position:relative;height:28px}
.dep-bar-bg{position:absolute;left:0;top:0;height:100%;border-radius:4px;opacity:.15}
.dep-bar-fg{position:absolute;left:0;top:0;height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:10px;color:#fff;font-weight:600}
.dep-val{width:80px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0}

.flag-card{border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.flag-card .flag-icon{font-size:18px;flex-shrink:0;line-height:1.4}
.flag-card .flag-title{font-size:12px;font-weight:600;color:#f8fafc;margin-bottom:2px}
.flag-card .flag-body{font-size:11px;color:#94a3b8;line-height:1.5}
.flag-danger{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25)}
.flag-warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25)}
.flag-info{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25)}
.flag-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap}
.flag-badge-danger{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.2)}
.flag-badge-warn{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}

// ---- OVERVIEW ----
// Overview sort state
let ovSort={col:'gap',asc:false}; // default: 격차 큰 순

function getStoreRow(s){
  const i=D.stores[s],ws=[...i.workers].filter(w=>w.days>=20).sort((a,b)=>b.avg_sales_adj-a.avg_sales_adj);
  const t=ws[0]||null,b=ws.length>=2?ws[ws.length-1]:null;
  const gap=t&&b?t.avg_sales_adj-b.avg_sales_adj:0;
  const arb=i.comp_stats.find(c=>c.type==='ARB/사원Only');
  const arbPct=arb?arb.diff_pct:-999;
  return{key:s,avg:i.store_avg,cnt:i.workers.length,top:t,bot:b,gap,arbPct,arbReal:arb?arb.diff_pct:null,flags:i.flags||[]};
}

function sortStores(rows,col,asc){
  const m=asc?1:-1;
  const fn={
    name:(a,b)=>a.key.localeCompare(b.key)*m,
    avg:(a,b)=>(a.avg-b.avg)*m,
    gap:(a,b)=>(a.gap-b.gap)*m,
    arb:(a,b)=>(a.arbPct-b.arbPct)*m,
  }[col]||((a,b)=>0);
  return[...rows].sort(fn);
}

function rOverview(el){
  const maxD=Math.max(...Object.values(D.dow_avg));
  let dB=DOW.map(d=>{const v=D.dow_avg[d]||0;const w=(v/maxD*100).toFixed(0);const c=['토','일'].includes(d)?'#f59e0b':'#3b82f6';return`<div class="dow-bar"><div class="dow-lb">${d}</div><div class="dow-fl" style="width:${w}%;background:${c}">${fmt(v)}</div></div>`}).join('');

  const rawRows=D.store_list.map(getStoreRow);
  const sorted=sortStores(rawRows,ovSort.col,ovSort.asc);

  const arrow=c=>ovSort.col===c?(ovSort.asc?' ▲':' ▼'):'';
  const thStyle='cursor:pointer;user-select:none';

  const sRows=sorted.map((r,idx)=>{
    const {key:s,avg,cnt,top:t,bot:b,gap,arbReal}=r;
    const rank=idx+1;
    const gapBar=gap>0?`<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><div style="width:${Math.min(gap/8000,100).toFixed(0)}px;height:14px;background:${gap>300000?'#f87171':gap>150000?'#fbbf24':'#4ade80'};border-radius:2px"></div><span>${fmt(gap)}</span></div>`:'<span class="muted">-</span>';
    return`<tr>
      <td style="color:#64748b;font-size:11px;text-align:center;width:28px">${rank}</td>
      <td style="font-weight:600;cursor:pointer;color:#38bdf8" onclick="selStore('${s}')">${s}</td>
      <td class="num">${fmt(avg)}</td>
      <td>${t?`${t.name} ${roleBadge(t.role)} <span class="pos">${fmt(t.avg_sales_adj)}</span>`:'-'}</td>
      <td>${b?`${b.name} ${roleBadge(b.role)} <span class="neg">${fmt(b.avg_sales_adj)}</span>`:'-'}</td>
      <td class="num" style="font-weight:600">${gapBar}</td>
      <td class="num">${arbReal!==null?pct(arbReal):'<span class="muted">-</span>'}</td>
      <td>${flagBadges(r.flags)}</td>
    </tr>`;
  }).join('');

  el.innerHTML=`
  <div class="chart-row">
    <div class="mc"><h3>요일별 평균 매출</h3>${dB}</div>
    <div class="mc"><h3>이벤트 기간 효과</h3>
      <div class="dow-bar"><div class="dow-lb" style="width:40px">평시</div><div class="dow-fl" style="width:${(D.event.normal/D.event.event*100).toFixed(0)}%;background:#475569">${fmt(D.event.normal)}</div></div>
      <div class="dow-bar"><div class="dow-lb" style="width:40px">이벤트</div><div class="dow-fl" style="width:100%;background:#f59e0b">${fmt(D.event.event)}</div></div>
      <p style="margin-top:10px;font-size:12px;color:#94a3b8">이벤트 기간 매출이 평시 대비 <span class="pos">+${D.event.effect_pct}%</span></p>
    </div>
  </div>
  <div class="section">
    <h2>매장별 요약 비교</h2>
    <p style="color:#64748b;font-size:11px;margin-bottom:10px">컬럼 헤더 클릭으로 정렬 변경 (기본: 격차 큰 순)</p>
    <div style="overflow-x:auto">
    <table><tr>
      <th style="width:28px">#</th>
      <th style="${thStyle}" onclick="ovSortBy('name')">매장${arrow('name')}</th>
      <th class="num" style="${thStyle}" onclick="ovSortBy('avg')">평균 일매출${arrow('avg')}</th>
      <th>보정매출 Top</th>
      <th>보정매출 Bottom</th>
      <th class="num" style="${thStyle}" onclick="ovSortBy('gap')">Top-Bot 격차${arrow('gap')}</th>
      <th class="num" style="${thStyle}" onclick="ovSortBy('arb')">ARBOnly 효과${arrow('arb')}</th>
      <th>특이점</th>
    </tr>${sRows}</table>
    </div>
  </div>`;
}

function ovSortBy(col){
  if(ovSort.col===col)ovSort.asc=!ovSort.asc;
  else{ovSort.col=col;ovSort.asc=col==='name'?true:false}

}

function rRole(el){
  // 매니저 의존도 차트
  let depChart='';
  const maxGap=D.mgr_dependency.length>0?Math.max(...D.mgr_dependency.map(d=>d.mgr_avg)):1;
  D.mgr_dependency.forEach(d=>{
    const mW=(d.mgr_avg/maxGap*100).toFixed(0);
    const aW=(d.arb_avg/maxGap*100).toFixed(0);
    const color=d.gap_pct>20?'#f87171':d.gap_pct>10?'#fbbf24':'#4ade80';
    depChart+=`
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;font-weight:600;cursor:pointer;color:#38bdf8" onclick="selStore('${d.store}')">${d.store}</span>

      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <span style="font-size:10px;color:#60a5fa;width:55px">매니저Only</span>

        </div>
      </div>
      <div style="display:flex;gap:4px;align-items:center;margin-top:2px">
        <span style="font-size:10px;color:#fbbf24;width:55px">ARBOnly</span>
        <div style="flex:1;height:20px;background:#1e293b;border-radius:4px;position:relative">
          <div style="width:${aW}%;height:100%;background:#f59e0b;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:10px;color:#fff">${fmt(d.arb_avg)}</div>
        </div>
      </div>
      <div style="font-size:10px;color:#64748b;margin-top:2px">ARBOnly ${d.arb_days}일 | 매니저 부재 시 보정매출 ${fmt(d.arb_avg)}</div>

  });

  // 매장별 구성 유형 비교 테이블
  let compRows='';
  D.store_list.forEach(s=>{
    const i=D.stores[s];
    if(i.comp_stats.length<2)return;
    i.comp_stats.sort((a,b)=>b.adj_avg-a.adj_avg);
    const total=i.comp_stats.reduce((a,c)=>a+c.days,0);
    // stacked bar
    const segs=i.comp_stats.map(c=>{
      const w=(c.days/total*100).toFixed(0);

      return`<div class="comp-seg" style="width:${w}%;background:${color}" title="${c.type}: ${c.days}일">${w>15?c.type:''}</div>`;
    }).join('');

    compRows+=`<tr>
      <td style="font-weight:600;cursor:pointer;color:#38bdf8" onclick="selStore('${s}')">${s}</td>
      <td style="min-width:180px"><div class="comp-bar">${segs}</div></td>`;

  const arbRows=arbRank.map((r,i)=>`<tr><td>${i+1}</td><td style="font-weight:600">${r.name}</td><td style="cursor:pointer;color:#38bdf8" onclick="selStore('${r.store}')">${r.store}</td><td class="num">${r.days}일</td><td class="num" style="font-weight:600">${fmt(r.avg_adj)}</td><td class="num">${pct(r.diff_pct)}</td></tr>`).join('');

  el.innerHTML=`
  <div class="section">
    <h2>매니저 의존도 분석</h2>
    <p style="color:#64748b;font-size:12px;margin-bottom:16px">매니저Only vs ARB/사원Only 보정매출 비교 — 차이가 클수록 매니저 부재 시 매출 타격이 큼</p>
    ${depChart}
  </div>

  <div class="section">
    <h2>매장별 근무 구성 유형별 보정매출</h2>
    <p style="color:#64748b;font-size:12px;margin-bottom:12px">
      <span style="display:inline-block;width:10px;height:10px;background:#8b5cf6;border-radius:2px;margin-right:4px"></span>매니저+ARB
      <span style="display:inline-block;width:10px;height:10px;background:#3b82f6;border-radius:2px;margin:0 4px 0 12px"></span>매니저Only
      <span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:2px;margin:0 4px 0 12px"></span>ARB/사원Only
    </p>
    <div style="overflow-x:auto">
    <table><tr><th>매장</th><th>구성 비율</th><th class="num">매니저+ARB</th><th class="num">매니저Only</th><th class="num">ARB/사원Only</th></tr>${compRows}</table>
    </div>
  </div>

  <div class="chart-row">
    <div class="section" style="margin-bottom:0">
      <h2>매니저 보정매출 Top 10</h2>
      <table><tr><th>#</th><th>이름</th><th>매장</th><th class="num">근무일</th><th class="num">보정매출</th><th class="num">매장대비</th></tr>${mgrRows}</table>
    </div>
    <div class="section" style="margin-bottom:0">
      <h2>ARB 보정매출 Top 10</h2>
      <table><tr><th>#</th><th>이름</th><th>매장</th><th class="num">근무일</th><th class="num">보정매출</th><th class="num">매장대비</th></tr>${arbRows}</table>
    </div>
  </div>

  <div class="section" style="margin-top:16px">
    <h2>해석 가이드</h2>
    <div class="insight-card">
      <div class="title">1. 매니저 의존도가 높은 매장 (ARBOnly -15% 이상)</div>
      <div class="body">매니저 공백일에 매출 하락이 크므로, 매니저 휴무일 최소화 또는 ARB 역량 강화가 필요합니다.<br>해당 매장: 롯데대전(-21.9%), AK기흥(-15.9%), 이마트검단(-15.9%), 스타필드위례(-15.8%), 스타필드명지(-15.4%)</div>

    </div>
    <div class="insight-card">
      <div class="title">3. 동일 역할 내 비교가 공정한 평가</div>
      <div class="body">매니저끼리, ARB끼리 비교해야 근무 조건(주말/이벤트 배치 비율)이 유사합니다.<br>각 매장 상세 페이지에서 역할별 그룹 비교를 확인하세요.</div>

// ---- RANKING ----
function rRanking(el){
  const rows=D.ranking.map((r,i)=>{
    const rank=i+1;
    const badge=rank<=3?`<span class="rank-badge rank-${rank}">${rank}</span>`:`<span class="rank-badge rank-n">${rank}</span>`;
    return`<tr><td>${badge}</td><td style="font-weight:600">${r.name}</td><td>${roleBadge(r.role)}</td><td style="cursor:pointer;color:#38bdf8" onclick="selStore('${r.store}')">${r.store}</td><td class="num">${r.days}일</td><td class="num" style="font-weight:600">${fmt(r.avg_adj)}</td><td class="num">${pct(r.diff_pct)}</td></tr>`;
  }).join('');
  el.innerHTML=`<div class="section"><h2>전체 근무자 보정매출 랭킹 (20일 이상)</h2><p style="color:#64748b;font-size:12px;margin-bottom:12px">보정매출 = 요일·이벤트·공휴일 효과를 제거한 표준화 매출</p><div style="overflow-x:auto"><table><tr><th>#</th><th>이름</th><th>역할</th><th>매장</th><th class="num">근무일</th><th class="num">보정매출</th><th class="num">매장대비</th></tr>${rows}</table></div></div>`;
}

// ---- STORE DETAIL ----
function rStore(el,sk){
  const i=D.stores[sk];if(!i)return;
  const ws=[...i.workers].sort((a,b)=>b.avg_sales_adj-a.avg_sales_adj);
  const maxAdj=Math.max(...ws.map(w=>w.avg_sales_adj));

  // 역할별 그룹
  const mgrs=ws.filter(w=>['매니저','부매니저'].includes(w.role));
  const arbs=ws.filter(w=>!['매니저','부매니저'].includes(w.role));

  const wRows=ws.map(w=>{
    const bW=(w.avg_sales_adj/maxAdj*100).toFixed(0);
    const c=w.diff_pct>=0?'#3b82f6':'#64748b';
    return`<tr>
      <td style="font-weight:600">${w.name}</td>
      <td>${roleBadge(w.role)}</td>
      <td class="num">${w.days}일</td>
      <td class="num">${fmt(w.avg_sales)}</td>
      <td class="num" style="font-weight:600">${fmt(w.avg_sales_adj)}</td>
      <td style="min-width:180px"><div class="bar-c"><div class="bar" style="width:${bW}%;background:${c}"></div><span style="font-size:11px">${pct(w.diff_pct)}</span></div></td>
      <td class="num">${fmt(w.median_sales)}</td>
      <td class="num">${w.event_days}일</td>
      <td class="num">${w.weekend_days}일</td>
    </tr>`;
  }).join('');

  // 구성 유형 분석
  let compHtml='';
  if(i.comp_stats.length>=2){
    const maxCA=Math.max(...i.comp_stats.map(c=>c.adj_avg));
    compHtml=i.comp_stats.map(c=>{
      const w=(c.adj_avg/maxCA*100).toFixed(0);
      const color=c.type==='매니저+ARB'?'#8b5cf6':c.type==='매니저Only'?'#3b82f6':'#f59e0b';
      return`<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:600;color:${color}">${c.type}</span>
          <span>${c.days}일 | ${pct(c.diff_pct)}</span>
        </div>
        <div style="height:24px;background:#0f172a;border-radius:4px;overflow:hidden">
          <div style="width:${w}%;height:100%;background:${color};border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:600">${fmt(c.adj_avg)}</div>
        </div>
      </div>`;
    }).join('');
  }

  // 역할별 비교 섹션
  let roleCompare='';
  if(mgrs.length>0&&arbs.length>0){
    const mAvg=mgrs.reduce((a,w)=>a+w.avg_sales_adj*w.days,0)/mgrs.reduce((a,w)=>a+w.days,0);
    const aAvg=arbs.reduce((a,w)=>a+w.avg_sales_adj*w.days,0)/arbs.reduce((a,w)=>a+w.days,0);
    const gap=mAvg-aAvg;
    roleCompare=`<div class="insight-card" style="margin-top:12px">
      <div class="title">역할별 평균 비교</div>
      <div class="body">
        <span class="role-badge role-mgr">매니저</span> 가중평균 보정매출 <strong>${fmt(Math.round(mAvg))}</strong> (${mgrs.map(w=>w.name).join(', ')})<br>
        <span class="role-badge role-arb">ARB</span> 가중평균 보정매출 <strong>${fmt(Math.round(aAvg))}</strong> (${arbs.map(w=>w.name).join(', ')})<br>
        매니저-ARB 격차: <strong style="color:${gap>0?'#4ade80':'#f87171'}">${fmt(Math.round(Math.abs(gap)))}</strong> ${gap>0?'(매니저가 높음)':'(ARB가 높음 — 역할 재검토 필요)'}
      </div>
    </div>`;
  }

  // DOW
  const colors=['#3b82f6','#f59e0b','#10b981','#f472b6','#a78bfa','#fb923c','#38bdf8','#4ade80'];
  let dowC='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center">'+DOW.map(d=>`<div style="font-size:11px;color:#94a3b8;padding:3px">${d}</div>`).join('')+'</div>';
  ws.forEach((w,wi)=>{
    dowC+=`<div style="margin-bottom:2px"><span style="font-size:10px;color:${colors[wi%colors.length]};font-weight:600">${w.name} <span style="color:#64748b">${w.role}</span></span><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
    DOW.forEach((_,di)=>{const v=w.dow_sales[di]||0;const h=maxAdj>0?Math.max(3,v/maxAdj*50):3;dowC+=`<div style="text-align:center"><div style="height:${h}px;background:${colors[wi%colors.length]};border-radius:2px;margin:0 auto;width:80%;opacity:.8" title="${fmt(v)}"></div><div style="font-size:9px;color:#64748b;margin-top:1px">${fmtK(v)}</div></div>`});
    dowC+='</div></div>';
  });

  // Month
  let mC='<div style="overflow-x:auto"><table style="font-size:11px"><tr><th>근무자</th><th>역할</th>';
  for(let m=1;m<=9;m++)mC+=`<th class="num">${m}월</th>`;
  mC+='</tr>';
  ws.forEach((w,wi)=>{
    mC+=`<tr><td style="color:${colors[wi%colors.length]};font-weight:600">${w.name}</td><td>${roleBadge(w.role)}</td>`;
    for(let m=1;m<=9;m++){const v=w.month_sales[m];mC+=v?`<td class="num">${fmt(v)}</td>`:'<td class="num muted">-</td>'}
    mC+='</tr>';
  });
  mC+='</table></div>';

  // Combos
  const combos=i.combos.map(c=>`<div class="combo-card"><div class="combo-w">${c.workers}</div><div class="combo-s">${c.days}일 | 평균 ${fmt(c.avg_sales)} | 보정 <strong>${fmt(c.avg_adj)}</strong></div></div>`).join('');

  // ---- 심층 분석 (매니저Only vs ARBOnly 비교) ----
  let deepHtml='';
  const dp=i.deep;
  if(dp && dp.fair_items && dp.fair_items.length>0){
    // 1) 요일 배치 비교
    const maxDN=Math.max(...[...Object.values(dp.mgr_dow),...Object.values(dp.arb_dow)].map(x=>x.n));
    let dowDist='<div style="display:grid;grid-template-columns:40px 1fr 1fr;gap:4px;align-items:center;margin-bottom:4px"><div></div><div style="font-size:10px;color:#3b82f6;font-weight:600;text-align:center">매니저Only (${dp.mgr_days}일)</div><div style="font-size:10px;color:#f59e0b;font-weight:600;text-align:center">ARB/사원Only (${dp.arb_days}일)</div></div>';
    DOW.forEach((_,di)=>{
      const md=dp.mgr_dow[di]||{n:0,avg:0};
      const ad=dp.arb_dow[di]||{n:0,avg:0};
      const mW=maxDN>0?(md.n/maxDN*100).toFixed(0):0;
      const aW=maxDN>0?(ad.n/maxDN*100).toFixed(0):0;
      dowDist+=`<div style="display:grid;grid-template-columns:40px 1fr 1fr;gap:4px;align-items:center;margin-bottom:2px">
        <div style="font-size:11px;color:#94a3b8;text-align:center">${DOW[di]}</div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:${mW}%;height:16px;background:#3b82f6;border-radius:2px;min-width:1px"></div><span style="font-size:9px;color:#64748b">${md.n}일</span></div>
        <div style="display:flex;align-items:center;gap:4px"><div style="width:${aW}%;height:16px;background:#f59e0b;border-radius:2px;min-width:1px"></div><span style="font-size:9px;color:#64748b">${ad.n}일</span></div>
      </div>`;
    });
    dowDist+=`<div style="margin-top:8px;font-size:11px;color:#94a3b8">주말 비율: <span style="color:#3b82f6;font-weight:600">매니저 ${dp.mgr_weekend_pct}%</span> vs <span style="color:#f59e0b;font-weight:600">ARB ${dp.arb_weekend_pct}%</span></div>`;

    // 2) 동일 조건 공정 비교
    const maxGap=Math.max(...dp.fair_items.map(f=>Math.abs(f.gap)));
    let fairRows=dp.fair_items.map(f=>{
      const label=DOW[f.dow]+(f.event?' 이벤트':' 평시');
      const gapW=maxGap>0?(Math.abs(f.gap)/maxGap*80).toFixed(0):0;
      const gapColor=f.gap>0?'#3b82f6':'#f59e0b';
      return`<tr>
        <td style="font-size:11px">${label}</td>
        <td class="num" style="font-size:11px">${fmt(f.mgr_avg)} <span class="muted">(${f.mgr_n})</span></td>
        <td class="num" style="font-size:11px">${fmt(f.arb_avg)} <span class="muted">(${f.arb_n})</span></td>
        <td style="min-width:120px"><div class="bar-c"><div class="bar" style="width:${gapW}%;background:${gapColor};height:14px"></div><span style="font-size:10px;color:${gapColor};font-weight:600">${f.gap>0?'+':''}${fmtK(f.gap)}</span></div></td>
      </tr>`;
    }).join('');

    const fairGapColor=dp.fair_gap>0?'#3b82f6':'#f59e0b';
    const fairWho=dp.fair_gap>0?'매니저':'ARB';

    // 3) 이벤트 기간 분리 비교
    let evtHtml='';
    if(dp.evt_comp.normal&&dp.evt_comp.event){
      const n=dp.evt_comp.normal, e=dp.evt_comp.event;
      const nGap=n.mgr_avg-n.arb_avg, eGap=e.mgr_avg-e.arb_avg;
      evtHtml=`<div style="margin-top:12px;padding:12px;background:#0f172a;border-radius:6px">
        <div style="font-size:12px;font-weight:600;color:#e2e8f0;margin-bottom:8px">이벤트/평시별 격차</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:11px">
          <div>
            <div style="color:#94a3b8;margin-bottom:4px">평시</div>
            <div>매니저 <strong>${fmt(n.mgr_avg)}</strong> (${n.mgr_n}일)</div>
            <div>ARB <strong>${fmt(n.arb_avg)}</strong> (${n.arb_n}일)</div>
            <div style="font-weight:600;color:${nGap>0?'#3b82f6':'#f59e0b'};margin-top:2px">차이: ${nGap>0?'+':''}${fmt(Math.abs(nGap))}</div>
          </div>
          <div>
            <div style="color:#94a3b8;margin-bottom:4px">이벤트</div>
            <div>매니저 <strong>${fmt(e.mgr_avg)}</strong> (${e.mgr_n}일)</div>
            <div>ARB <strong>${fmt(e.arb_avg)}</strong> (${e.arb_n}일)</div>
            <div style="font-weight:600;color:${eGap>0?'#3b82f6':'#f59e0b'};margin-top:2px">차이: ${eGap>0?'+':''}${fmt(Math.abs(eGap))}</div>
          </div>
        </div>
        ${Math.abs(eGap)>Math.abs(nGap)*1.5?'<div style="margin-top:8px;font-size:11px;color:#f87171;font-weight:600">⚠ 이벤트 기간에 격차가 더 크게 벌어짐</div>':''}
      </div>`;
    }

    // 4) 핵심 인사이트
    const wkendGap=Math.abs(dp.mgr_weekend_pct-dp.arb_weekend_pct);
    let insights=[];
    if(wkendGap>20) insights.push(`요일 배치 차이가 큼: 매니저 주말 ${dp.mgr_weekend_pct}% vs ARB ${dp.arb_weekend_pct}% → 단순 평균 비교는 불공정`);
    if(dp.fair_gap>0) insights.push(`동일 조건에서도 매니저가 ${fmt(dp.fair_gap)} 높음 → 순수 역량 차이 존재`);
    else insights.push(`동일 조건에서 ARB가 ${fmt(Math.abs(dp.fair_gap))} 높음 → 역할 재검토 필요`);
    if(dp.evt_comp.event&&dp.evt_comp.normal){
      const eG=dp.evt_comp.event.mgr_avg-dp.evt_comp.event.arb_avg;
      const nG=dp.evt_comp.normal.mgr_avg-dp.evt_comp.normal.arb_avg;
      if(Math.abs(eG)>Math.abs(nG)*1.5) insights.push('이벤트 기간에 격차가 평시보다 크게 확대 → 이벤트 대응력 차이');
    }

    deepHtml=`
    <div class="section">
      <h2>매니저Only vs ARBOnly 심층 비교</h2>
      <p style="color:#64748b;font-size:11px;margin-bottom:16px">매니저만 근무한 날 vs ARB/사원만 근무한 날의 매출을 요일·이벤트 조건별로 분해 비교</p>
      <div class="chart-row" style="margin-bottom:0">
        <div>
          <h3 style="font-size:13px;color:#94a3b8;margin-bottom:8px">요일별 근무 배치</h3>
          ${dowDist}
        </div>
        <div>
          <h3 style="font-size:13px;color:#94a3b8;margin-bottom:8px">동일 조건 공정 비교</h3>
          <div style="overflow-x:auto">
          <table style="font-size:11px"><tr><th>조건</th><th class="num">매니저Only</th><th class="num">ARBOnly</th><th>격차</th></tr>${fairRows}</table>
          </div>
          <div style="margin-top:8px;padding:8px 12px;background:#0f172a;border-radius:6px;font-size:12px">
            동일조건 평균: 매니저 <strong style="color:#3b82f6">${fmt(dp.fair_mgr_mean)}</strong> vs ARB <strong style="color:#f59e0b">${fmt(dp.fair_arb_mean)}</strong>
            → <strong style="color:${fairGapColor}">${fairWho}가 ${fmt(Math.abs(dp.fair_gap))} 높음</strong>
          </div>
          ${evtHtml}
        </div>
      </div>
      <div style="margin-top:16px">
        ${insights.map(t=>'<div class="insight-card" style="margin-bottom:6px"><div class="body" style="font-size:12px">'+t+'</div></div>').join('')}
      </div>
    </div>`;
  }

  const flagsHtml=renderFlags(i.flags);
  el.innerHTML=`
  <div class="section">
    <div class="store-hd">
      <div class="sn">${sk}</div>
      <div class="sm">평균 일매출 <strong style="color:#38bdf8">${fmt(i.store_avg)}</strong><span>보정평균 <strong>${fmt(i.store_avg_adj)}</strong></span><span>${i.total_days}일</span><span>${i.workers.length}명</span></div>
    </div>
    ${flagsHtml}
    <div style="overflow-x:auto">
    <table><tr><th>근무자</th><th>역할</th><th class="num">근무일</th><th class="num">평균매출</th><th class="num">보정매출</th><th>매장평균 대비</th><th class="num">중앙값</th><th class="num">이벤트</th><th class="num">주말</th></tr>${wRows}</table>
    </div>
    ${roleCompare}
  </div>

  <div class="chart-row">
    <div class="mc"><h3>근무 구성 유형별 보정매출</h3>${compHtml||'<p class="muted" style="font-size:12px">구성 유형이 1가지뿐이라 비교 불가</p>'}</div>
    <div class="mc"><h3>근무자별 요일 매출</h3>${dowC}</div>
  </div>

  ${deepHtml}

  <div class="chart-row">
    <div class="mc"><h3>근무자별 월별 평균 매출</h3>${mC}</div>
    <div class="mc"><h3>근무자 조합별 매출 (5일 이상)</h3><p style="font-size:11px;color:#64748b;margin-bottom:8px">같은 날 함께 근무한 조합별 보정매출</p>${combos}</div>
  </div>`;
}

renderST();render();
</script>
